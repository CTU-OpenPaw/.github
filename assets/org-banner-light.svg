<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="banner-title-light banner-desc-light">
  <title id="banner-title-light">CTU-OpenPaw — LatticeDX v0.4.2 Open Enterprise Operating Platform</title>
  <desc id="banner-desc-light">Flagship light-mode organization banner for CTU-OpenPaw featuring LatticeDX v0.4.2, Pure-OSI Apache-2.0 licensing, 7 plugins, 56 PG16 FORCE RLS tables, 257/257 SBOM, and 2,509 tests.</desc>
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="52%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="glow-orange-light" cx="80%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F45D22" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#FB923C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F45D22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal-light" cx="18%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-bar-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F45D22"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="title-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F45D22"/>
    </linearGradient>
    <linearGradient id="shield-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FAF4E4"/>
    </linearGradient>
    <pattern id="lattice-grid-light" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.8" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1.4" fill="#94A3B8" fill-opacity="0.45"/>
    </pattern>
    <filter id="card-shadow-light" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#bg-light)" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#lattice-grid-light)"/>
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#glow-orange-light)"/>
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#glow-teal-light)"/>

  <!-- Top Brand Accent Bar -->
  <rect x="56" y="18" width="1168" height="4" rx="2" fill="url(#accent-bar-light)" opacity="0.88"/>

  <!-- Left Content: Eyebrow Pills -->
  <g transform="translate(56, 46)">
    <rect x="0" y="0" width="248" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#F45D22"/>
    <text x="29" y="19.5" class="mono" font-size="11.5" font-weight="700" fill="#9A3412" letter-spacing="0.6">CTU-OPENPAW · OSS ORG</text>

    <rect x="260" y="0" width="84" height="30" rx="15" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="302" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#1D4ED8">v0.4.2</text>

    <rect x="356" y="0" width="192" height="30" rx="15" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.2"/>
    <text x="452" y="19.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0F766E">Apache-2.0 · Pure-OSI</text>
  </g>

  <!-- Main Title & Subtitle -->
  <text x="56" y="142" class="sans" font-size="52" font-weight="800" fill="#0F172A" letter-spacing="-1.2">CTU-OpenPaw</text>

  <text x="56" y="190" class="sans" font-size="23" font-weight="700" fill="#1E293B">
    <tspan fill="url(#title-accent-light)" font-weight="800">LatticeDX</tspan>
    <tspan fill="#64748B" font-weight="500"> — </tspan>
    <tspan fill="#1E293B">Open Enterprise Operating Platform</tspan>
  </text>

  <text x="56" y="226" class="sans" font-size="15.5" font-weight="500" fill="#475569">
    Agentic App Builder 2.0 · LatticeFlow v2 · Multi-Portal · IIoT Digital Twin
  </text>

  <!-- Bottom Verified Metric Chips -->
  <g transform="translate(56, 266)">
    <rect x="0" y="0" width="176" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#card-shadow-light)"/>
    <circle cx="16" cy="18" r="4" fill="#F45D22"/>
    <text x="28" y="22.5" class="mono" font-size="12" font-weight="600" fill="#1E293B">7 Apache-2.0 Plugins</text>

    <rect x="188" y="0" width="164" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#card-shadow-light)"/>
    <circle cx="204" cy="18" r="4" fill="#2563EB"/>
    <text x="216" y="22.5" class="mono" font-size="12" font-weight="600" fill="#1E293B">56 PG16 FORCE RLS</text>

    <rect x="364" y="0" width="216" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#card-shadow-light)"/>
    <circle cx="380" cy="18" r="4" fill="#0D9488"/>
    <text x="392" y="22.5" class="mono" font-size="12" font-weight="600" fill="#1E293B">257/257 SBOM · 0 BSL-1.1</text>

    <rect x="592" y="0" width="180" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#card-shadow-light)"/>
    <circle cx="608" cy="18" r="4" fill="#7C3AED"/>
    <text x="620" y="22.5" class="mono" font-size="12" font-weight="600" fill="#1E293B">2,509 Tests · 124 E2E</text>
  </g>

  <!-- Right Graphic: Lattice Ecosystem Vector Emblem -->
  <g transform="translate(840, 32)">
    <!-- Outer Lattice Orbit & Connectors -->
    <circle cx="205" cy="148" r="118" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 5"/>
    <circle cx="205" cy="148" r="88" fill="none" stroke="#FDBA74" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Vector Connection Lines to 4 Repo Nodes -->
    <line x1="205" y1="148" x2="72" y2="54" stroke="#F45D22" stroke-width="1.6" stroke-opacity="0.55"/>
    <line x1="205" y1="148" x2="340" y2="54" stroke="#2563EB" stroke-width="1.6" stroke-opacity="0.55"/>
    <line x1="205" y1="148" x2="72" y2="244" stroke="#0D9488" stroke-width="1.6" stroke-opacity="0.55"/>
    <line x1="205" y1="148" x2="340" y2="244" stroke="#7C3AED" stroke-width="1.6" stroke-opacity="0.55"/>

    <!-- Center Hexagonal Shield + Stylized OpenPaw Vector Emblem -->
    <polygon points="205,74 269,111 269,185 205,222 141,185 141,111" fill="url(#shield-light)" stroke="#111827" stroke-width="3" stroke-linejoin="round" filter="url(#card-shadow-light)"/>
    <!-- Antenna Node (left-middle open bay, echoing mascot tail) -->
    <polyline points="141,154 123,154 116,140" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="114" cy="136" r="6.5" fill="#F45D22" stroke="#111827" stroke-width="2.5"/>
    <!-- Geometric OpenPaw Toe Beans + Main Pad -->
    <ellipse cx="180" cy="122" rx="9" ry="12" transform="rotate(-18 180 122)" fill="#F45D22" stroke="#111827" stroke-width="2.5"/>
    <ellipse cx="205" cy="113" rx="9.5" ry="12.5" fill="#F45D22" stroke="#111827" stroke-width="2.5"/>
    <ellipse cx="230" cy="122" rx="9" ry="12" transform="rotate(18 230 122)" fill="#F45D22" stroke="#111827" stroke-width="2.5"/>
    <path d="M 176 164 C 176 144, 190 137, 205 137 C 220 137, 234 144, 234 164 C 234 179, 222 187, 205 187 C 188 187, 176 179, 176 164 Z" fill="#F45D22" stroke="#111827" stroke-width="2.8"/>

    <!-- Satellite Node 1: lattice-dx -->
    <g transform="translate(0, 34)" filter="url(#card-shadow-light)">
      <rect x="0" y="0" width="120" height="34" rx="9" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.3"/>
      <circle cx="15" cy="17" r="4" fill="#F45D22"/>
      <text x="26" y="21.5" class="mono" font-size="11.5" font-weight="700" fill="#0F172A">lattice-dx</text>
    </g>

    <!-- Satellite Node 2: lattice-docs -->
    <g transform="translate(274, 34)" filter="url(#card-shadow-light)">
      <rect x="0" y="0" width="128" height="34" rx="9" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
      <circle cx="15" cy="17" r="4" fill="#2563EB"/>
      <text x="26" y="21.5" class="mono" font-size="11.5" font-weight="700" fill="#0F172A">lattice-docs</text>
    </g>

    <!-- Satellite Node 3: lattice-templates -->
    <g transform="translate(0, 228)" filter="url(#card-shadow-light)">
      <rect x="0" y="0" width="146" height="34" rx="9" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.3"/>
      <circle cx="15" cy="17" r="4" fill="#0D9488"/>
      <text x="26" y="21.5" class="mono" font-size="11" font-weight="700" fill="#0F172A">lattice-templates</text>
    </g>

    <!-- Satellite Node 4: NocoBase 2.2.50 -->
    <g transform="translate(262, 228)" filter="url(#card-shadow-light)">
      <rect x="0" y="0" width="140" height="34" rx="9" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.3"/>
      <circle cx="15" cy="17" r="4" fill="#7C3AED"/>
      <text x="26" y="21.5" class="mono" font-size="11" font-weight="700" fill="#0F172A">NocoBase 2.2.50</text>
    </g>
  </g>
</svg>
